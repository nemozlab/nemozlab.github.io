<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>네모 플레이어 스킨파츠</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2233">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: 3D viewer left, mold list + controls right; stacks on phone.
   Color: one hue per mold (blue, orange, green, purple) on a quiet blue-grey ground. */
:root{
  --bg:#f3f5f9; --panel:#ffffff; --fg:#1b2233; --muted:#5d667a; --line:#d9deea; --stage:#e9edf5;
  --m1:#1f6fd6; --m2:#e8730f; --m3:#7d8798; --m4:#f1f4f9; --m1b:#14a8c4;
  --m5-bg:#e3f6f9; --m1-bg:#eaf2fd; --m2-bg:#fdf1e6; --m3-bg:#eceff3; --m4-bg:#f3eaf8;
  font-size:15px;
  --font:'Noto Sans KR','Noto Sans SC','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161f; --panel:#1b2130; --fg:#e8ecf5; --muted:#99a3b8; --line:#2c3447; --stage:#0e121a;
  --m5-bg:#10303a; --m1-bg:#16263f; --m2-bg:#3a2515; --m3-bg:#272c37; --m4-bg:#2a1b36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --panel:#1b2130; --fg:#e8ecf5; --muted:#99a3b8; --line:#2c3447; --stage:#0e121a;
  --m5-bg:#10303a; --m1-bg:#16263f; --m2-bg:#3a2515; --m3-bg:#272c37; --m4-bg:#2a1b36; color-scheme:dark}
*{box-sizing:border-box}
:root[lang="zh"]{--font:'Noto Sans SC','Noto Sans KR','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
#lzh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
#lko{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;
  padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.wrap{max-width:none;margin:0 auto}
h1{font-size:1.15rem;margin:0;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px}
.top .seg{margin-left:0}
.sub{color:var(--muted);font-size:.95rem;margin:0 0 16px}
.foot{color:var(--muted);font-size:.78rem;margin:10px 2px 0;line-height:1.5}
.grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
@media (max-width:820px){.ib.mo-only{display:inline-flex!important}.ib.txt span{display:inline}.top{display:none}.stage{border:0}.legend{display:block}.legend-side{display:none}.grid{grid-template-columns:minmax(0,1fr)}.panel{width:auto!important}.stage{height:100vh;height:100dvh;min-height:420px;border-radius:0}.wrap{margin:0 -10px}.legend .foot{font-size:.7rem}.ib span{display:none}.ib{padding:0 9px}.fold{display:inline-flex!important;width:auto!important;height:28px!important;padding:0 10px!important;gap:5px;align-items:center;place-items:unset;font:inherit;font-size:.74rem;font-weight:600;margin-left:auto}.fold .fl{display:inline}.fold svg{transform:rotate(90deg)!important}.fold[aria-expanded="true"],.fold[aria-expanded="true"]:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}.panel{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:50vh;max-height:50dvh;overflow:auto;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.28);border-radius:14px}.ex input{width:56px}.dock{padding:6px 8px;gap:6px}.dock .seg button{padding:0 9px}body{padding-block:0}.panel{max-height:72vh;max-height:72dvh;transform:translateY(0);transition:transform .28s ease,visibility 0s}.panel.shut{transform:translateY(calc(100% + 24px));visibility:hidden;transition:transform .28s ease,visibility 0s .28s}.mold{padding:6px 10px}.mh h3{font-size:.84rem}.pc{padding:2px 9px 2px 7px;font-size:.74rem}.mold .sub{margin-top:5px}.mold:first-child .mh{margin-bottom:4px!important}.n{width:22px;height:22px}}
.panel{width:280px;transition:width .15s}
.panel.collapsed{width:46px}
.panel.collapsed .mh h3,.panel.collapsed .sw,.panel.collapsed .sub{display:none}
.panel.collapsed .mold{padding:7px 0;display:flex;justify-content:center}
.panel.collapsed .mh{width:auto;gap:0}
.fold.on svg{transform:rotate(180deg)}
.fl{display:none}
.ib.mo-only{display:none}
.ib[hidden]{display:none!important}
.pc[hidden]{display:none!important}
.fold{margin-left:auto;flex:none;display:grid;place-items:center;width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);cursor:pointer}
.fold:hover{color:var(--fg)}
.fold:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:8px}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden;height:calc(100vh - 62px);height:calc(100dvh - 62px);min-height:420px;display:flex;flex-direction:column}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
.hint{position:absolute;right:12px;bottom:12px;max-width:46%;text-align:right;line-height:1.35;font-size:.78rem;color:var(--muted);pointer-events:none}
.tools .btn{padding:6px 12px;font-size:.8rem}
.view{min-width:0}
.dock{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.cvwrap{position:relative;flex:1;min-height:0}
.dock{gap:8px}
.tg{display:flex;flex-wrap:nowrap;gap:6px}
.dock .seg{display:flex;flex:none;margin:0;padding:2px}
.dock .seg button{height:26px;padding:0 12px;font-size:.78rem}
.ex{flex:none;display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted)}
.ex input{width:72px;min-width:0}
.ib{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:8px;box-shadow:none;flex:none;font-size:.74rem}
svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tip{position:absolute;left:12px;top:12px;max-width:50%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:.88rem;min-width:0;flex:1 1 auto;max-width:max-content;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip:empty{display:none}
.dim{margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:.74rem;line-height:1.5;color:var(--muted)}
.dim table{border-collapse:collapse}
.dim th{font-weight:600;text-align:right;padding:0 0 2px 14px}
.dim th:first-child,.dim td:first-child{text-align:left;padding-left:0}
.dim td{text-align:right;padding:0 0 0 14px;font-variant-numeric:tabular-nums}
.dim .dn{margin-top:3px;font-size:.68rem;opacity:.8}
.sk{background:#111114!important;color:#e8c14a!important;border-color:#111114!important;font-weight:700}
#skg[hidden]{display:none!important}
.seg.old{display:none!important}
.ex[hidden]{display:none!important}
.skl{display:block;font-size:.74rem;color:var(--muted);margin-bottom:6px}
.sw9{display:flex;flex-wrap:wrap;gap:7px}
.swb{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swb.plain{background:linear-gradient(135deg,#e5e7ee 50%,#b7bdca 50%)}
.swb[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
#artw[hidden]{display:none!important}
.dim[data-mode=orig] th:nth-child(2),.dim[data-mode=orig] td:nth-child(2),.dim[data-mode=split] th:nth-child(3),.dim[data-mode=split] td:nth-child(3){color:var(--fg);font-weight:700}
.legend-side{padding:2px 4px 0}
.legend-side .foot{margin:4px 0 0}
.legend-side .prices{flex-direction:column;align-items:flex-start;gap:3px}
.panel.collapsed .legend-side{display:none}
.legend{display:none;position:absolute;left:12px;bottom:10px;right:12px;pointer-events:none}
.legend .foot{margin:2px 0 0}
.seg.v1{margin-left:0;box-shadow:none;background:var(--bg)}
.seg.v1 button{padding:4px 12px}
.mold:first-child .mh{margin-bottom:20px}
.seg{margin-left:auto;flex:none;display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:.8rem;font-weight:600;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:not([aria-pressed="true"]):hover{color:var(--fg)}
.seg button:focus-visible{outline:3px solid var(--fg);outline-offset:1px}
.tip b{font-weight:700}
.panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mold{padding:9px 10px 9px;border-top:1px solid var(--line)}
.mold:first-child{border-top:0}
.mh{display:flex;align-items:center;gap:8px;width:100%;font:inherit;color:var(--fg);background:transparent;border:0;padding:0;cursor:pointer;text-align:left}
.mh h3 small{display:block;font-weight:400;font-size:.74rem;white-space:nowrap;color:var(--muted);margin-top:2px}
.mh h3{margin:0;font-size:.9rem;font-weight:600;line-height:1.3;flex:1;min-width:0;white-space:nowrap}
.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:.78rem;line-height:1;display:flex;align-items:center;justify-content:center;padding-bottom:1px}
.sw{flex:none;align-self:center;width:28px;height:16px;border-radius:999px;background:var(--c);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:14px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.mh[aria-pressed="false"] .sw{background:var(--line)}
.mh[aria-pressed="false"] .sw::after{left:2px}
.mh[aria-pressed="false"] .n{background:var(--line);color:var(--muted)}
.mh[aria-pressed="false"] h3{color:var(--muted)}
.mold.lite .mh[aria-pressed="true"] .n{color:#4a5365;box-shadow:inset 0 0 0 1.5px #aab3c2}
.mold.lite .mh[aria-pressed="true"] .sw{background:#5b6475}
.mold.lite .pc[aria-pressed="true"]::before{box-shadow:inset 0 0 0 1.5px #98a2b3}
.mh:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.sub{margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row label{font-size:.9rem}
input[type=range]{flex:1;min-width:120px;accent-color:var(--fg)}
.btn{font:inherit;font-size:.86rem;font-weight:600;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.quiet{box-shadow:none;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--fg)}
.note{font-size:.85rem;color:var(--muted);line-height:1.5;margin:0}
.pc{white-space:nowrap;font:inherit;font-size:.78rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.pc:hover{border-color:var(--c)}
.pc::before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--c)}
.pc[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.pc[aria-pressed="false"]::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.pc:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.3em;background:var(--c)}
.dot.lt{box-shadow:inset 0 0 0 1.5px #98a2b3}
.prices{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin-top:4px}
.prices b{color:var(--fg)}
.pp{white-space:nowrap}
</style>

</head>
<body>
<div class="wrap">
  <div class="top"><h1 data-k="title">네모 플레이어 스킨파츠</h1><div class="seg" role="group" aria-label="언어 / 语言"><button type="button" id="lko" lang="ko" aria-pressed="true">한국어</button><button type="button" id="lzh" lang="zh" aria-pressed="false">中文</button></div></div>
  <div class="grid">
    <div class="view">
    <div class="stage">
      <div class="dock">
        <div class="tg" id="skg"><button class="btn ib txt sk" id="sk" type="button"><span data-k="sk1">스킨파츠 빼기</span></button><button class="btn ib txt sk" id="sw" type="button"><span data-k="sw">스킨파츠 교체</span></button><div class="seg" id="dsg"><button type="button" data-d="0" data-k="dz0">기본형</button><button type="button" data-d="1" data-k="dz1" aria-pressed="true">데이지</button></div></div>
        <div class="seg" role="group"><button type="button" id="vp" aria-pressed="true"><span data-k="vp">완제품</span></button><button type="button" id="vm" aria-pressed="false"><span data-k="vm">금형별 분해</span></button></div>
        <div class="seg old" role="group"><button type="button" id="asm" aria-pressed="false" data-kt="asm"><span data-k="asm">합쳐진 모양</span></button><button type="button" id="sep" aria-pressed="true" data-kt="sep"><span data-k="sep">분리된 모양</span></button></div>
        <div class="seg old" role="group"><button type="button" id="cm" aria-pressed="true"><span data-k="cm">금형 색</span></button><button type="button" id="cr" aria-pressed="false"><span data-k="cr">완제품 색</span></button></div>
        <div class="ex"><label for="ex" data-k="ex">분해</label><input type="range" id="ex" min="0" max="100" value="100" data-kt="exT"><span id="exv" hidden>100</span></div>
                <div class="tg">
        <button class="btn ib" id="reset" type="button" data-kt="reset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span data-k="reset">각도 초기화</span></button>
        <button class="btn ib" id="resetall" type="button" data-kt="resetall"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-k="resetall">초기화</span></button>
        <button class="btn ib" id="spin" type="button" aria-pressed="false" data-kt="spin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span data-k="spin">자동 회전</span></button>
        </div>
        <button class="btn ib txt mo-only" id="lt" type="button"><span>中文</span></button><button class="btn ib mo-only" id="fs" type="button" data-kt="fs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button class="fold" id="fold" type="button" data-kt="fold" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span class="fl" data-k="mold">금형</span></button>
      </div>
      <div class="cvwrap"><canvas id="cv"></canvas><div class="tip" id="tip"></div><div class="legend"><p class="foot prices"><b data-k="mc">금형비</b><span class="pp" style="--c:var(--m1)"><i class="dot"></i>① <span data-k="pr1">¥11,000 · 220만원</span></span><span class="pp" style="--c:var(--m2)"><i class="dot"></i>② <span data-k="pr2">¥8,000 · 160만원</span></span><span class="pp" style="--c:var(--m3)"><i class="dot"></i>③ <span data-k="pr3">¥9,350 · 187만원</span></span><span class="pp" style="--c:var(--m4)"><i class="dot lt"></i>④ <span data-k="pr4">¥5,000 · 100만원</span></span></p></div></div>
    </div>
    </div>
    <div class="panel" id="panel">
      <div class="list">
        <section class="mold" style="--c:var(--m1)">
          <button class="mh" id="c1" type="button" aria-pressed="true"><span class="n">1</span><h3><span data-k="m1">전면 + 후면 커버</span></h3><span class="sw"></span></button>
          <div class="sub"><div class="seg v1" role="group"><button type="button" id="mo" aria-pressed="false" data-k="mo">원안</button><button type="button" id="ms" aria-pressed="true" data-k="ms">수정안</button></div></div>
          <div class="sub chips" id="p1"></div>
          <div class="sub" id="artw"><span class="skl" data-k="skl">스킨파츠 색 · 데이지는 끼움 부품(공통)</span><div class="sw9" id="sw9"></div></div>
          <div class="dim" id="dim" data-mode="split"><table><thead><tr><th data-k="tt">두께 (mm)</th><th data-k="mo">원안</th><th data-k="ms">수정안</th></tr></thead><tbody><tr><td data-k="dT">전체 두께</td><td>23.9</td><td>23.9</td></tr><tr><td data-k="dU">상단</td><td>1.9</td><td><span data-k="tbd">미정</span> + 0.85</td></tr><tr><td data-k="dS">측면</td><td>1.7</td><td><span data-k="tbd">미정</span> + 0.85</td></tr></tbody></table><div class="dn" data-k="dN">수정안 = 본체(두께 미정) + 스킨파츠 0.85</div></div>
        </section>
        <section class="mold" style="--c:var(--m2)">
          <button class="mh" id="c2" type="button" aria-pressed="true"><span class="n">2</span><h3><span data-k="m2">스피커 후면 + 버튼</span></h3><span class="sw"></span></button>
          <div class="sub chips" id="p2"></div>
        </section>
        <section class="mold" style="--c:var(--m3)">
          <button class="mh" id="c3" type="button" aria-pressed="true"><span class="n">3</span><h3><span data-k="m3">투명 도어</span></h3><span class="sw"></span></button>
          <div class="sub chips" id="p3"></div>
        </section>
        <section class="mold lite" style="--c:var(--m4)">
          <button class="mh" id="c4" type="button" aria-pressed="true"><span class="n">4</span><h3><span data-k="m4">LED 투명 캡</span></h3><span class="sw"></span></button>
          <div class="sub chips" id="p4"></div>
        </section>
      </div>
      <div class="legend-side"><p class="foot prices"><b data-k="mc">금형비</b><span class="pp" style="--c:var(--m1)"><i class="dot"></i>① <span data-k="pr1">¥11,000 · 220만원</span></span><span class="pp" style="--c:var(--m2)"><i class="dot"></i>② <span data-k="pr2">¥8,000 · 160만원</span></span><span class="pp" style="--c:var(--m3)"><i class="dot"></i>③ <span data-k="pr3">¥9,350 · 187만원</span></span><span class="pp" style="--c:var(--m4)"><i class="dot lt"></i>④ <span data-k="pr4">¥5,000 · 100만원</span></span></p></div>
    </div>
  </div>
</div>

<script>
(function(){
  var DEF={
    '0o':{n:'전면 커버 (원안)',z:'前盖(原方案)',m:1,off:[0,0,0]},
    '0':{n:'전면 커버',z:'前盖',m:1,off:[0,0,0]},
    '1':{n:'후면 커버',z:'后盖',m:1,off:[0,0,62]},

    if(daisyG)daisyG.visible=d===1;
    if(cardM)cardM.visible=(view==='p'&&d===1);
    applyAllowed();if(allowed().indexOf(skinIdx)<0)setSkin(allowed()[0]);else setSkin(skinIdx);
  }
  document.getElementById('dsg').addEventListener('click',function(ev){var t=ev.target.closest('button');if(t)setDesign(parseInt(t.getAttribute('data-d'),10))});
  function setSkin(i){skinIdx=i;
    [].forEach.call(document.querySelectorAll('#sw9 .swb'),function(b){b.setAttribute('aria-pressed',String(parseInt(b.getAttribute('data-i'),10)===i))});
    
    if(window.__cx){drawArt(window.__cx,window.__cw,window.__ch,'#'+('000000'+(i>=0?SKC[i][0]:0xa8afbd).toString(16)).slice(-6));window.__ct.needsUpdate=true}
    style()}
  function skLabel(){var k=skOut>0.5?'sk0':'sk1',e=document.querySelector('#sk span');e.setAttribute('data-k',k);e.textContent=T(k)}
  function skAnim(to,ms,cb){var f=skOut,t0=performance.now();skBusy=true;(function st(n){var u=Math.min(1,(n-t0)/ms),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;skOut=f+(to-f)*e;place();if(u<1)requestAnimationFrame(st);else{skOut=to;place();skBusy=false;skLabel();if(cb)cb()}})(t0)}
  function skReady(){if(explode>0)setEx(0);controls.autoRotate=false;spin.setAttribute('aria-pressed','false')}
  document.getElementById('sk').addEventListener('click',function(){if(skBusy)return;skReady();skAnim(skOut<0.5?1:0,700)});
  document.getElementById('sw').addEventListener('click',function(){if(skBusy)return;skReady();
    var go=function(){skAnim(1,650,function(){setTimeout(function(){setSkin(nextSkin());setTimeout(function(){skAnim(0,650)},350)},250)})};
    if(skOut>0.5){setTimeout(function(){setSkin(nextSkin());setTimeout(function(){skAnim(0,650)},350)},50)}else go()});
  function setReal(v){real=v;document.getElementById('cm').setAttribute('aria-pressed',String(!v));document.getElementById('cr').setAttribute('aria-pressed',String(v));style()}
  document.getElementById('cm').addEventListener('click',function(){setReal(false)});
  document.getElementById('cr').addEventListener('click',function(){setReal(true)});
  document.getElementById('mo').addEventListener('click',function(){setMode('orig')});
  document.getElementById('ms').addEventListener('click',function(){setMode('split')});
  var fold=document.getElementById('fold'),panel=document.getElementById('panel');
  fold.addEventListener('click',function(){
    if(isM()){var sh=panel.classList.toggle('shut');fold.setAttribute('aria-expanded',String(!sh));return}
    var c=panel.classList.toggle('collapsed');fold.classList.toggle('on',c);fold.setAttribute('aria-expanded',String(!c));
  });
  function isM(){return window.matchMedia&&matchMedia('(max-width:820px)').matches}
  if(isM()){panel.classList.add('shut');fold.setAttribute('aria-expanded','false')}
  var spin=document.getElementById('spin');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){controls.autoRotate=false;spin.setAttribute('aria-pressed','false')}
  spin.addEventListener('click',function(){
    controls.autoRotate=!controls.autoRotate;spin.setAttribute('aria-pressed',String(controls.autoRotate));
  });

  function applyLang(){
    document.documentElement.lang=lang?'zh':'ko';
    document.title=T('title');
    [].forEach.call(document.querySelectorAll('[data-k]'),function(e){e.textContent=T(e.getAttribute('data-k'))});
    [].forEach.call(document.querySelectorAll('[data-kt]'),function(e){var t=T(e.getAttribute('data-kt'));e.title=t;e.setAttribute('aria-label',t)});
    Object.keys(pbtn).forEach(function(id){pbtn[id].textContent=cn(id)});
    document.getElementById('lt').firstChild.textContent=lang?'한국어':'中文';
    document.getElementById('lko').setAttribute('aria-pressed',String(!lang));document.getElementById('lzh').setAttribute('aria-pressed',String(!!lang));
    hint.innerHTML=selected?'<b>'+label(selected)+'</b>':'';
  }
  function setLang(v){lang=v;try{localStorage.setItem('nemo-lang',v?'zh':'ko')}catch(e){}applyLang()}
  document.getElementById('lt').addEventListener('click',function(){setLang(lang?0:1)});
  document.getElementById('lko').addEventListener('click',function(){setLang(0)});
  document.getElementById('lzh').addEventListener('click',function(){setLang(1)});
  applyLang();
  var de=document.documentElement,fsBtn=document.getElementById('fs');
  function inFs(){return document.fullscreenElement||document.webkitFullscreenElement}
  function toggleFs(){try{var p;if(inFs()){p=(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{var r=de.requestFullscreen||de.webkitRequestFullscreen;if(r)p=r.call(de)}if(p&&p.catch)p.catch(function(){})}catch(e){}}
  if(!(de.requestFullscreen||de.webkitRequestFullscreen))fsBtn.hidden=true;
  fsBtn.addEventListener('click',toggleFs);

  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
})();
</script>
