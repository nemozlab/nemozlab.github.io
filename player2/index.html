const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  let buf;
  if(window.crypto&&crypto.subtle&&crypto.subtle.importKey){
    try{
      const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},key,u8(P.ct));
    }catch(e){ if(e&&e.name==='OperationError') throw new Error('BAD'); buf=null; }
  }
  if(!buf){ // fallback for previews/sandboxes without WebCrypto
    await new Promise(r=>setTimeout(r,30));
    const key=FB.pbkdf2(new TextEncoder().encode(pw),u8(P.s),P.it); const ct=u8(P.ct); const iv=u8(P.iv);
    const head=new TextDecoder().decode(FB.gcmDec(key,iv,ct,32));
    if(!/^\s*<!doctype/i.test(head)) throw new Error('BAD');
    buf=FB.gcmDec(key,iv,ct);
  }
  const html=new TextDecoder().decode(buf);
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault(); const pw=document.getElementById('pw').value.normalize('NFKC').trim(); const go=document.getElementById('go'); const err=document.getElementById('err');
  if(!pw) return; go.disabled=true; err.textContent='여는 중… · 打开中… · 開いています…';
  try{ await open_(pw); try{sessionStorage.setItem('player2_pw',pw);}catch(_){} }
  catch(e){ err.textContent=(e&&e.message==='BAD')?'비밀번호가 틀렸어요 · 密码错误 · パスワードが違います':'열 수 없어요. Chrome 브라우저에서 열어 주세요. · 无法打开，请用Chrome打开。· 開けません。Chromeで開いてください。'; go.disabled=false; console.error(e); }
});
(async()=>{let s=null; try{s=sessionStorage.getItem('player2_pw');}catch(_){} if(s){try{await open_(s);}catch(_){}}})();
</script>
